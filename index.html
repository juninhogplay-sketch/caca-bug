w <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAÇA BUG</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f2f2f2;
color:#222;
}

header{
background:#111;
color:white;
text-align:center;
padding:25px 10px;
}

#ofertas{
max-width:700px;
margin:25px auto;
padding:10px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 4px 15px #ccc;
}

.bug{
display:inline-block;
background:#e53935;
color:white;
padding:6px 10px;
border-radius:8px;
font-weight:bold;
}

.desconto{
display:inline-block;
background:#16a34a;
color:white;
padding:6px 10px;
border-radius:8px;
font-weight:bold;
}

.antigo{
color:#888;
text-decoration:line-through;
}

.preco{
font-size:32px;
font-weight:bold;
color:#16a34a;
}

.botao{
display:block;
background:#16a34a;
color:white;
text-align:center;
text-decoration:none;
padding:14px;
border-radius:10px;
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>🐛 CAÇA BUG 💰</h1>
<p>Caçador de ofertas e bugs de preço</p>
</header>

<div id="ofertas">Carregando...</div>

<script>
fetch("./ofertas.json")
.then(r=>r.json())
.then(ofertas=>{
const area=document.getElementById("ofertas");
area.innerHTML="";

ofertas.forEach(o=>{

const desconto=Math.round((1-o.preco_oferta/o.preco_normal)*100);

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<span class="bug">${o.tipo==="possivel_bug"?"🐛 POSSÍVEL BUG":"🔥 OFERTA"}</span>
<img src="https://via.placeholder.com/600x300" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:15px;">

<h2>${o.produto}</h2>
<p>🏪 ${o.loja}</p>

<p class="antigo">De: R$ ${Number(o.preco_normal).toFixed(2).replace(".",",")}</p>

<p class="desconto">🔥 ${desconto}% DE DESCONTO</p>

<p class="preco">R$ ${Number(o.preco_oferta).toFixed(2).replace(".",",")}</p>

<a class="botao" href="${o.link}">VER OFERTA</a>
`;

area.appendChild(card);

});
})
.catch(()=>{
document.getElementById("ofertas").innerHTML=
"<p>❌ Erro ao carregar ofertas.</p>";
});
</script>

</body>
</html>
