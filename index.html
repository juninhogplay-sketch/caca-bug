<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAÇA BUG</title>
</head>

<body>

<header>
<h1>🐛 CAÇA BUG 💰</h1>
<p>Caçador de ofertas e bugs de preço</p>
</header>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

#ofertas {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.oferta {
  background: white;
  padding: 24px;
  margin-bottom: 22px;
  border-radius: 20px;
  box-shadow: 0 6px 22px rgba(0,0,0,.14);
  border: 1px solid #e5e5e5;
}

.oferta h2 {
  margin: 5px 0 12px 0;
  font-size: 23px;
}

.oferta p {
  margin: 8px 0;
  font-size: 16px;
}

.oferta h2 {
  margin: 0 0 10px 0;
  font-size: 22px;
}

.oferta p {
  margin: 7px 0;
  font-size: 16px;
}

.oferta p:last-child {
  font-size: 28px;
  font-weight: bold;
  color: green;
}
.etiqueta {
  display: inline-block;
  background: #ff3333;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}

.antigo {
  color: #888;
  text-decoration: line-through;
}

.preco {
  font-size: 32px !important;
  font-weight: bold;
  color: #008000;
  margin: 8px 0 15px;
}

.botao {
  display: block;
  background: #16a34a;
  color: white;
  text-decoration: none;
  padding: 14px 20px;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
  margin-top: 15px;
  font-size: 17px;
}

.botao:hover {
  opacity: 0.9;
}
.preco {
  font-size: 34px !important;
  font-weight: bold;
  color: #16a34a;
  margin: 8px 0 15px;
}
    .desconto {
  display: inline-block;
  background: #16a34a;
  color: white;
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  margin: 5px 0 10px;
}
  </style>

<p>Caçador de ofertas e bugs de preço</p>

<div id="ofertas">
  Carregando ofertas...
</div>

<script>
fetch("./ofertas.json")
  .then(resposta => resposta.json())
  .then(ofertas => {

    const area = document.getElementById("ofertas");

    area.innerHTML = "";

    ofertas.forEach(oferta => {

      const item = document.createElement("div");

      item.innerHTML = `
  <span class="etiqueta">
    ${oferta.tipo === "possivel_bug" ? "🐛 POSSÍVEL BUG" : "🔥 OFERTA"}
  </span>

  <h2>${oferta.produto}</h2>

  <p>🏪 ${oferta.loja}</p>

  <p class="antigo">
    De: R$ ${Number(oferta.preco_normal).toFixed(2).replace(".", ",")}
  </p>
<p class="desconto">
  🔥 ${Math.round((1 - oferta.preco_oferta / oferta.preco_normal) * 100)}% DE DESCONTO
</p>
  <p class="preco">
    R$ ${Number(oferta.preco_oferta).toFixed(2).replace(".", ",")}
  </p>

  <a href="${oferta.link}" class="botao">
    VER OFERTA
  </a>
`;

      area.appendChild(item);

    });

  })
  .catch(erro => {
    document.getElementById("ofertas").innerHTML =
      "ERRO AO CARREGAR OFERTAS";
  });
  
</script>
  
</body>
</html>
