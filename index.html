<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAÇA BUG</title>
</head>

<body>

<h1>🐛 CAÇA BUG 💰</h1>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

#ofertas {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.oferta {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

.preco {
  font-size: 30px;
  font-weight: bold;
  color: green;
}
  </style>

<p>Caçador de ofertas e bugs de preço</p>

<div id="ofertas">
  Carregando ofertas...
</div>

<script>
fetch("./ofertas.json")
  .then(resposta => resposta.json())
  .then(ofertas => {

    const area = document.getElementById("ofertas");

    area.innerHTML = "";

    ofertas.forEach(oferta => {

      const item = document.createElement("div");

      item.innerHTML = `
        <h2>${oferta.produto}</h2>
        <p>Loja: ${oferta.loja}</p>
        <p>De: R$ ${oferta.preco_normal}</p>
        <p>Por: R$ ${oferta.preco_oferta}</p>
      `;

      area.appendChild(item);

    });

  })
  .catch(erro => {
    document.getElementById("ofertas").innerHTML =
      "ERRO AO CARREGAR OFERTAS";
  });
</script>

</body>
</html>
