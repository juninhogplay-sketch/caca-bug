<html lang="pt-BR">
<head>

  <title>CAÇA BUG 🐛</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #ccc;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .titulo h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .titulo p {
      color: #666;
    }

    #ofertas {
      display: grid;
      gap: 18px;
    }

    .oferta {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .imagem {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .conteudo {
      padding: 20px;
    }

    .bug {
      display: inline-block;
      background: #e53935;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .desconto {
      display: inline-block;
      background: #168a35;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 5px;
    }

    .oferta h3 {
      font-size: 21px;
      margin: 10px 0;
    }

    .loja,
    .data {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .preco-antigo {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
    }

    .preco {
      font-size: 28px;
      font-weight: bold;
      color: #168a35;
      margin: 5px 0 15px;
    }

    .botao {
      display: inline-block;
      background: #168a35;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .mensagem {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
