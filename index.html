<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAÇA BUG 🐛</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    #ofertas {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
      display: grid;
      gap: 20px;
    }

    .oferta {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    .bug {
      display: inline-block;
      background: #ff3333;
      color: white;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }

    h2 {
      margin-bottom: 5px;
    }

    .loja {
      color: #666;
      margin: 8px 0;
    }

    .preco-antigo {
      color: #888;
      text-decoration: line-through;
    }

    .preco {
      font-size: 30px;
      font-weight: bold;
      color: #008000;
      margin: 8px 0 15px;
    }

    .botao {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .mensagem {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐛 CAÇA BUG 💰</h1>
    <p>Caçador de ofertas e bugs de preço</p>
  </header>

  <main id="ofertas">
    <div class="mensagem">
      🔎 Carregando ofertas...
    </div>
  </main>

  <script>
    fetch("./ofertas.json")
      .then(resposta => {
        if (!resposta.ok) {
          throw new Error("Erro ao carregar ofertas.json");
        }
        return resposta.json();
      })
      .then(ofertas => {

        const area = document.getElementById("ofertas");

        area.innerHTML = "";

        ofertas.forEach(oferta => {

          const card = document.createElement("div");
          card.className = "oferta";

          const etiqueta =
            oferta.tipo === "possivel_bug"
              ? "🐛 POSSÍVEL BUG"
              : "🔥 OFERTA";

          card.innerHTML = `
            <span class="bug">${etiqueta}</span>

            <h2>${oferta.produto}</h2>

            <div class="loja">
              🏪 ${oferta.loja}
            </div>

            <div class="preco-antigo">
              De R$ ${Number(oferta.preco_normal).toFixed(2).replace(".", ",")}
            </div>

            <div class="preco">
