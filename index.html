<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAÇA BUG 🐛</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #ccc;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .titulo h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .titulo p {
      color: #666;
    }

    #ofertas {
      display: grid;
      gap: 18px;
    }

    .oferta {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .bug {
      display: inline-block;
      background: #e53935;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .oferta h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .loja {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .preco-antigo {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
    }

    .preco {
      font-size: 28px;
      font-weight: bold;
      color: #168a35;
      margin: 5px 0 15px;
    }

    .botao {
      display: inline-block;
      background: #168a35;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .mensagem {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐛 CAÇA BUG 💰</h1>
    <p>Caçador de ofertas e bugs de preço</p>
  </header>

  <main class="container">

    <div class="titulo">
      <h2>🔥 Ofertas encontradas</h2>
      <p>Preços absurdamente baixos merecem ser caçados.</p>
    </div>

    <div id="ofertas">
      <div class="mensagem">🔎 Carregando ofertas...</div>
    </div>

  </main>

  <footer>
    © 2026 CAÇA BUG — Encontre. Compare. Economize. 🐛💰
  </footer>

  <script>
    fetch("ofertas.json")
      .then(resposta => resposta.json())
      .then(ofertas => {

        const area = document.getElementById("ofertas");

        area.innerHTML = "";

        ofertas.forEach(oferta => {

          const card = document.createElement("div");

          card.className = "oferta";

          const etiqueta =
            oferta.tipo === "possivel_bug"
              ? "🐛 POSSÍVEL BUG"
              : "🔥 OFERTA";

          card.innerHTML = `
            <span class="bug">${etiqueta}</span>

            <h3>${oferta.produto}</h3>

            <div class="loja">
              🏪 ${oferta.loja}
            </div>

            <div class="preco-antigo">
              De R$ ${oferta.preco_normal.toFixed(2).replace(".", ",")}
            </div>

            <div class="preco">
              R$ ${oferta.preco_oferta.toFixed(2).replace(".", ",")}
            </div>

            <a href="${oferta.link}" class="botao">
              VER OFERTA
            </a>
          `;

          area.appendChild(card);
        });

      })
      .catch(() => {
        document.getElementById("ofertas").innerHTML =
          '<div class="mensagem">⚠️ Não foi possível carregar as ofertas.</div>';
      });
  </script>

</body>
</html>
